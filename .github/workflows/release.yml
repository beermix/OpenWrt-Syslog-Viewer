name: Build and Release Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 pyinstaller pillow

      - name: Generate Application Icon
        run: |
          python generate_icon.py

      - name: Build Standalone Executable
        run: |
          pyinstaller --name="OpenWrt-Syslog-Viewer" --onefile --noconsole --clean --icon=app_icon.ico "openwrt syslog viewer.py"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Syslog-Viewer-Windows
          path: dist/OpenWrt-Syslog-Viewer.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenWrt-Syslog-Viewer.exe
          name: OpenWrt Syslog Viewer ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true